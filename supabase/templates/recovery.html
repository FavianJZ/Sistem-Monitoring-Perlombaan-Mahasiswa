<!--
  Template "Reset Password".
  Tautan langsung ke /reset-password dengan token_hash, bukan {{ .ConfirmationURL }}.
  Halaman ResetPassword menukarnya lewat verifyOtp({ token_hash, type: 'recovery' }),
  jadi tidak bergantung pada daftar Redirect URLs maupun hash #access_token.
  Pastikan "Site URL" di Supabase = domain aplikasi (Vercel atau localhost).
-->
<div style="font-family: 'Open Sans', Arial, sans-serif; max-width: 480px; margin: 0 auto; color: #334155;">
  <div style="border-top: 4px solid #0096d6; padding: 24px; background: #ffffff;">
    <p style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 1px; color: #a85f00;">
      SIMONLOMBA - BINUS UNIVERSITY
    </p>
    <h2 style="margin: 12px 0 8px; font-size: 20px; color: #1e293b;">Atur ulang kata sandi</h2>
    <p style="margin: 0 0 20px; font-size: 14px; line-height: 1.6;">
      Kami menerima permintaan mengganti kata sandi untuk akun <strong>{{ .Email }}</strong>.
    </p>
    <p style="margin: 0 0 20px;">
      <a href="{{ .SiteURL }}/reset-password?token_hash={{ .TokenHash }}&type=recovery"
         style="display: inline-block; padding: 12px 20px; background: #0077b3; color: #ffffff;
                font-weight: 700; font-size: 14px; text-decoration: none; border-radius: 6px;">
        Buat kata sandi baru
      </a>
    </p>
    <p style="margin: 0; font-size: 12px; color: #64748b; line-height: 1.6;">
      Tautan berlaku 1 jam dan hanya bisa dipakai sekali. Jika Anda tidak meminta ini, abaikan email ini.
    </p>
  </div>
</div>
