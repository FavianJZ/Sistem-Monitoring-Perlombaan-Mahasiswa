# Konfigurasi Supabase lokal (supabase start). Key yang tidak ditulis memakai bawaan CLI.
# Hanya berlaku untuk stack lokal; proyek hosted diatur lewat Dashboard.
project_id = "simonlomba"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

# Semua email lokal ditangkap di sini, tidak benar-benar terkirim: http://127.0.0.1:54324
[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "http://127.0.0.1:5173/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
# Harus sama dengan input 6 digit di ModalVerifikasiOtp.jsx.
otp_length = 6
otp_expiry = 3600
max_frequency = "60s"

[auth.email.template.confirmation]
subject = "Kode verifikasi akun SiMonLomba"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.magic_link]
subject = "Kode verifikasi SiMonLomba"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.recovery]
subject = "Atur ulang kata sandi SiMonLomba"
content_path = "./supabase/templates/recovery.html"
