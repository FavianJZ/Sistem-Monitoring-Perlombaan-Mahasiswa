# Konfigurasi Supabase lokal (supabase start). Key yang tidak ditulis memakai bawaan CLI.
# Hanya berlaku untuk stack lokal; proyek hosted diatur lewat Dashboard.
project_id = "simonlomba"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

# Semua email lokal ditangkap di sini, tidak benar-benar terkirim: http://127.0.0.1:54324
[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "http://127.0.0.1:5173/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Tanpa verifikasi email: signUp langsung mengembalikan sesi.
enable_confirmations = false
